<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Ready: Chemical Safety for New Lab Technicians</title>
<meta name="description" content="A scenario-based chemical safety onboarding course for new lab technicians. Seven moments, seven decisions. Portfolio concept by Tshwjxeeb Vaaj.">
<meta property="og:title" content="Lab Ready: Chemical Safety for New Lab Technicians">
<meta property="og:description" content="Seven moments where lab safety decisions happen, practiced in short scenarios.">
<meta property="og:image" content="img/cover.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C2400D'/%3E%3Cpath d='M26 14h12M29 14v14L18 48a4 4 0 0 0 3.5 6h21a4 4 0 0 0 3.5-6L35 28V14' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --accent:#C2400D; --accent-dark:#9A320A; --peach:#FDF1EC; --peach-line:#F3C9B6;
  --ink:#2B2B2B; --muted:#6B6B6B; --line:#E2E2E2; --band:#F4F4F4; --bg:#FFFFFF;
  --good:#1F7A4D; --good-soft:#E8F4EC; --bad:#B42318; --bad-soft:#FDECEA;
  --serif:"Merriweather", Georgia, "Times New Roman", serif;
  --sans:"Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --col:720px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:300 17px/1.75 var(--serif);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid #2563EB;outline-offset:2px}
main:focus{outline:none}
.col{max-width:calc(var(--col) + 40px);margin:0 auto;padding:0 20px}
.wide{max-width:1000px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
b,strong{font-weight:700}

/* top bar + drawer */
.topbar{position:sticky;top:0;z-index:20;background:#F5F5F5;height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;font:500 13px var(--sans)}
.topbar .menu-btn{width:36px;height:36px;border:0;background:none;display:grid;place-items:center;cursor:pointer;border-radius:4px}
.topbar .menu-btn:hover{background:#E8E8E8}
.topbar .crumb{border:0;background:none;padding:4px 2px;cursor:pointer;font:500 13px var(--sans);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.topbar .crumb:hover{text-decoration:underline}
.topbar .spacer{flex:1}
.topbar .pct{color:var(--muted);font-weight:400}
.progress{position:sticky;top:44px;z-index:19;height:3px;background:#E8E8E8}
.progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.drawer{position:fixed;inset:0;z-index:40;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.drawer nav{position:absolute;left:0;top:0;bottom:0;width:min(360px,90vw);background:#fff;overflow:auto;padding:16px 0 24px;box-shadow:4px 0 24px rgba(0,0,0,.15)}
.drawer .d-title{font:700 16px/1.3 var(--sans);padding:6px 22px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.drawer .d-title small{display:block;font:400 13px var(--sans);color:var(--muted);margin-top:4px}

/* lesson menu (cover + drawer) */
.menu-sec{font:500 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:26px 0 10px;border-bottom:1px solid var(--line)}
.drawer .menu-sec{padding:18px 22px 8px;border:0}
.menu-row{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;text-align:left;padding:13px 6px;cursor:pointer;font:400 15px var(--sans);color:var(--ink);border-radius:4px}
.drawer .menu-row{padding:11px 22px;border-radius:0}
.menu-row:hover{background:#F7F7F7}
.menu-row[aria-current="page"]{background:var(--peach);font-weight:500}
.menu-row .ico{flex:none;width:18px;color:#8A8A8A}
.menu-row .t{flex:1}
.menu-row .st{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid #CFCFCF;display:grid;place-items:center;color:#fff;font-size:11px}
.menu-row.done .st{background:var(--good);border-color:var(--good)}

/* cover */
.cover{position:relative;min-height:500px;background:#111 center/cover no-repeat;display:flex;align-items:center}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.1) 100%)}
.cover .in{position:relative;max-width:1000px;width:100%;margin:0 auto;padding:60px 20px}
.cover .by{display:flex;align-items:center;gap:10px;color:#fff;font:500 13px var(--sans);margin-bottom:22px}
.avatar{width:30px;height:30px;border-radius:50%;background:#DADADA;flex:none;display:grid;place-items:center;font:700 12px var(--sans);color:#555}
.cover h1{color:#fff;font:700 clamp(32px,5.4vw,46px)/1.15 var(--sans);margin:0 0 26px;max-width:600px}
.cover .ctas{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.start{border:0;background:#fff;color:#111;border-radius:999px;padding:15px 42px;font:700 13px var(--sans);letter-spacing:.1em;cursor:pointer}
.start:hover{background:#F1F1F1}
.details-btn{border:0;background:none;color:#fff;font:700 13px var(--sans);letter-spacing:.1em;cursor:pointer;display:flex;align-items:center;gap:8px}
.details{background:#fff;border-radius:6px;padding:18px 20px;margin-top:18px;max-width:560px;font:400 14.5px/1.6 var(--sans)}
.details ul{margin:6px 0 0;padding-left:18px}
.page-foot{font:400 12.5px/1.6 var(--sans);color:var(--muted);padding:36px 20px 30px;max-width:1000px;margin:0 auto}
.page-foot a{color:var(--muted);margin-right:16px}

/* lesson header */
.lh{padding:56px 0 46px;border-bottom:1px solid var(--line)}
.lh .count{font:italic 300 13px var(--serif);color:var(--muted);margin:0 0 8px}
.lh h1{font:700 clamp(30px,5vw,40px)/1.2 var(--sans);margin:0 0 18px}
.lh .by{display:flex;align-items:center;gap:10px;font:400 12.5px var(--sans);color:var(--muted);margin-bottom:34px}
.lh .rule{width:100px;height:3px;background:var(--accent)}

/* blocks */
.blk{padding:22px 0}
.blk.band{background:var(--band);padding:56px 0}
.blk.tight{padding:12px 0}
p{margin:0 0 18px}
.lead-b b{font-weight:700}
.why{background:var(--peach);border-radius:4px;padding:18px 22px;margin:30px 0 16px}
.why small{display:block;font:500 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.why p{margin:0;font-size:15.5px;line-height:1.7}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid #D5D5D5;background:#fff;border-radius:999px;padding:6px 14px;font:500 12.5px var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:#F6F6F6}
.chip .tri{color:var(--accent)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.transcript{background:#FAFAFA;border:1px solid var(--line);border-radius:4px;padding:16px 18px;font:400 14.5px/1.65 var(--sans);margin:10px 0 0;max-height:320px;overflow:auto}
.photo-text{position:relative;background:#000 center/cover no-repeat;min-height:440px;display:flex;align-items:center;margin:20px 0}
.photo-text::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.78),rgba(0,0,0,.35) 55%,rgba(0,0,0,0))}
.photo-text .in{position:relative;max-width:1000px;width:100%;margin:0 auto;padding:40px 20px}
.photo-text p{color:#fff;font:400 clamp(20px,3vw,25px)/1.45 var(--sans);max-width:480px;margin:0}
.photo-text p::before{content:"";display:block;width:56px;height:3px;background:#fff;margin-bottom:22px}
.note{text-align:center;padding:52px 0}
.note::before{content:"";display:block;width:56px;height:3px;background:var(--accent);margin:0 auto 26px}
.note p{font:300 clamp(21px,3.2vw,26px)/1.45 var(--sans);margin:0}
h2.bt{font:700 21px/1.3 var(--sans);margin:0 0 22px}
.sub{font:400 14.5px var(--sans);color:var(--muted);margin:-12px 0 20px}
.card{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.08);border-radius:2px}
.kc{border-left:4px solid var(--accent);padding:28px 30px 26px}
@media (max-width:560px){.kc{padding:22px 18px}}
.kc .tag{font:500 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.kc .q{font:500 18px/1.45 var(--sans);margin:0 0 16px}
.kc .hint{font:400 13.5px var(--sans);color:var(--muted);margin:-8px 0 16px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid #D9D9D9;background:#fff;border-radius:3px;padding:12px 14px;margin:0 0 10px;cursor:pointer;font:300 15.5px/1.45 var(--serif)}
.opt:hover:not([disabled]){border-color:#B0B0B0}
.opt .r{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid #8A8A8A}
.opt.sel{border-color:var(--accent);background:var(--peach)}
.opt.sel .r{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--peach)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .r{border-color:var(--good);background:var(--good);box-shadow:inset 0 0 0 3px var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .r{border-color:var(--bad);background:var(--bad);box-shadow:inset 0 0 0 3px var(--bad-soft)}
.opt[disabled]{cursor:default}
.btn{display:inline-block;border:0;background:var(--accent);color:#fff;border-radius:2px;padding:13px 34px;font:700 12.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none;margin-top:8px}
.btn:hover{background:var(--accent-dark)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
.btn.ghost:hover{background:var(--peach)}
.fb{margin-top:16px;padding:14px 16px;border-radius:3px;font:400 14.5px/1.6 var(--sans)}
.fb b{display:block;margin-bottom:2px}
.fb.ok{background:var(--good-soft);color:#14532D}
.fb.no{background:var(--bad-soft);color:#7A1D14}
.fb.info{background:var(--peach);color:#5A2410}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.pcard{border-top:3px solid var(--accent);padding:20px 20px 22px;text-align:left;border-left:0;border-right:0;border-bottom:0;cursor:pointer;width:100%}
.pcard:hover{background:#FFFBF9}
.pcard h3,.gcard h3{font:700 15px/1.4 var(--sans);margin:0 0 8px}
.pcard p,.gcard p{font:300 14px/1.6 var(--serif);margin:0}
.pcard .go{display:block;margin-top:12px;font:700 11.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.gcard{border-top:3px solid var(--accent);padding:20px 20px 22px}
.gcard img{margin:-20px -20px 16px;width:calc(100% + 40px);max-width:none;height:170px;object-fit:cover}
/* numbered */
.numbered{position:relative}
.num-row{position:relative;padding:28px 0 0}
.num-row .dv{display:flex;align-items:center;gap:0;margin:0 0 26px}
.num-row .dv::before,.num-row .dv::after{content:"";flex:1;height:1px;background:var(--line)}
.num-row .dv span{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 13px var(--sans);margin:0 12px}
.ncard{border-left:4px solid var(--accent);padding:22px 24px}
.ncard h3{font:700 15.5px/1.4 var(--sans);margin:0 0 6px}
.ncard p{font:300 14.5px/1.65 var(--serif);margin:0}
.ncard.has-img{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:center;padding:16px 20px 16px 16px}
.ncard.has-img img{width:200px;height:112px;object-fit:cover;border-radius:2px}
@media (max-width:560px){.ncard.has-img{grid-template-columns:1fr}.ncard.has-img img{width:100%;height:auto}}
/* callout */
.callout{border-left:4px solid var(--accent);padding:28px 32px}
@media (max-width:560px){.callout{padding:22px 20px}}
.callout h3{font:italic 400 18px var(--serif);color:var(--accent);margin:0 0 10px}
.callout .lede{font:500 14.5px var(--sans);margin:0 0 10px}
.callout ul{list-style:none;margin:0;padding:0}
.callout li{position:relative;padding-left:16px;margin:0 0 10px;font-size:15.5px;line-height:1.65}
.callout li::before{content:"•";position:absolute;left:0;color:var(--muted)}
/* scenario */
.who{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.who .av{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:700 18px var(--sans);color:#fff;background:#6B7C93}
.who .meta b{display:block;font:700 15px var(--sans)}
.who .meta small{font:400 13px var(--sans);color:var(--muted)}
.bubble{background:#F5F5F5;border-radius:12px;padding:12px 16px;margin-top:8px;font:italic 300 15.5px/1.6 var(--serif)}
/* matching */
.mrow{display:grid;grid-template-columns:1fr 24px 1fr;gap:10px;align-items:center;margin-bottom:12px}
.mrow .l{border:1px solid #D9D9D9;border-radius:3px;padding:10px 12px;font:400 14px/1.4 var(--sans);background:#fff}
.mrow .ar{text-align:center;color:#9A9A9A}
.mrow select{width:100%;border:1px solid #D0D0D0;background:#F1F1F1;border-radius:3px;padding:10px 8px;font:400 14px var(--sans)}
.mrow.right select{border-color:var(--good);background:var(--good-soft)}
.mrow.wrong select{border-color:var(--bad);background:var(--bad-soft)}
@media (max-width:560px){.mrow{grid-template-columns:1fr}.mrow .ar{display:none}}
/* flashcards */
.flash{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.fc{perspective:900px;border:0;background:none;padding:0;cursor:pointer;height:190px;text-align:center;width:100%}
@media (max-width:560px){.fc{height:200px}.fc svg{width:64px;height:64px}.fc .bt2{font-size:13px}.hot{width:30px;height:30px;margin:-15px 0 0 -15px;font-size:12.5px}}
.fc .inner{display:block;position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .inner{transform:rotateY(180deg)}
.fc .face{position:absolute;box-sizing:border-box;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid #E1E1E1;border-radius:3px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.fc .back{transform:rotateY(180deg);background:var(--peach);border-color:var(--peach-line)}
.fc svg{width:84px;height:84px;margin-bottom:12px}
.fc .ft{font:700 14px/1.35 var(--sans)}
.fc .bt2{font:300 14px/1.55 var(--serif)}
.fc .mf{font:500 10.5px var(--sans);letter-spacing:.1em;color:var(--accent);margin-bottom:10px}
.caption{font:400 13px var(--sans);color:var(--muted);text-align:center;margin-top:14px}
@media (prefers-reduced-motion:reduce){.fc .inner{transition:none}}
/* storyline shell */
.story{background:var(--peach);border:1.5px solid var(--peach-line);border-radius:4px;padding:30px 32px}
@media (max-width:560px){.story{padding:22px 16px}}
.story .tag{font:500 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.story h3{font:700 23px/1.3 var(--sans);margin:0 0 10px}
.story .intro{font-size:15.5px;line-height:1.7;margin:0 0 18px}
.counter{font:700 13px var(--sans);color:var(--accent);margin:0 0 12px}
.stage{position:relative;border-radius:3px;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
.stage img{width:100%;height:auto}
.hot{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:2px solid #fff;background:var(--accent);color:#fff;font:700 14px var(--sans);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35);padding:0}
.hot:hover{background:var(--accent-dark)}
.hot.seen{background:var(--good)}
.hot.fine{background:#6B7280}
.hot.active{outline:3px solid #fff;outline-offset:2px}
.pop{background:#fff;border-radius:3px;box-shadow:0 2px 10px rgba(0,0,0,.12);padding:16px 18px;margin-top:14px;font:400 14.5px/1.6 var(--sans)}
.pop b{display:block;font-size:15px;margin-bottom:2px}
.pop.ok{border-left:4px solid var(--good)}
.pop.fineb{border-left:4px solid #9CA3AF}
.pop.probe{border-left:4px solid var(--accent)}
.alarm{animation:flash .5s steps(2) 6}
@keyframes flash{50%{box-shadow:inset 0 0 0 6px #E5484D}}
/* label decoder */
.glabel{background:#fff;border:2px solid #222;border-radius:4px;max-width:520px;font:400 14px/1.5 var(--sans);overflow:hidden}
.glabel button{display:block;width:100%;text-align:left;border:0;border-top:1px solid #E5E5E5;background:#fff;padding:10px 14px 10px 46px;cursor:pointer;position:relative}
.glabel button:first-child{border-top:0}
.glabel button:hover{background:#FAFAFA}
.glabel button .mk{position:absolute;left:10px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font:700 12px var(--sans);display:grid;place-items:center}
.glabel button.seen .mk{background:var(--good)}
.glabel small{display:block;font:700 10.5px var(--sans);letter-spacing:.08em;color:#666}
.glabel .pn{font:900 22px var(--sans);letter-spacing:.02em}
.glabel .picts{display:flex;gap:10px}
.glabel .picts svg{width:52px;height:52px}
.glabel .sig{font:900 20px var(--sans);letter-spacing:.08em}
/* sorting */
.sort .current{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);border-radius:3px;max-width:280px;margin:0 auto 20px;padding:20px;text-align:center}
.sort .current small{display:block;font:400 12px var(--sans);color:var(--muted);margin-bottom:6px}
.sort .current b{font:500 17px/1.4 var(--sans)}
.piles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.pile{border:1.5px dashed #C9C9C9;border-radius:3px;background:#fff;min-height:96px;padding:16px 12px;font:500 14.5px/1.4 var(--sans);cursor:pointer;text-align:center}
.pile:hover{border-color:var(--accent);background:#FFFBF9}
.pile .got{display:block;font:400 12.5px/1.5 var(--sans);color:var(--good);margin-top:8px}
.sort .help{font:400 13px var(--sans);color:var(--muted);text-align:center;margin:-8px 0 18px}
/* tabs */
.tabs [role=tablist]{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs [role=tab]{border:0;background:none;padding:12px 18px;font:500 14.5px var(--sans);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs [role=tab][aria-selected=true]{border-bottom-color:var(--accent);color:var(--accent)}
.tabs [role=tabpanel]{padding:22px 4px 4px}
.tabs ul{margin:0;padding-left:20px}
.tabs li{margin:0 0 10px}
/* checklist */
.checklist{list-style:none;padding:0;margin:0}
.checklist label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;font-size:15.5px;line-height:1.55;cursor:pointer;border-bottom:1px solid #F0F0F0}
.checklist input{width:19px;height:19px;margin:3px 0 0;accent-color:var(--accent);flex:none}
.checklist .done-msg{margin-top:14px}
/* accordion */
.acc{border-top:1px solid var(--line)}
.acc button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:15px 2px;font:700 15px var(--sans);cursor:pointer;text-align:left}
.acc button span{color:var(--accent);font-size:20px;line-height:1}
.acc .panel{padding:4px 2px 16px;border-bottom:1px solid var(--line);font-size:15.5px}
/* first 60 */
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px;font:500 14px var(--sans)}
.timer .clock{font:700 22px var(--sans);color:var(--accent);min-width:64px}
.timer .bar{flex:1;min-width:120px;height:6px;background:#EEDDD5;border-radius:3px;overflow:hidden}
.timer .bar span{display:block;height:100%;background:var(--accent)}
.cards6{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.c6{border:1.5px solid #E0CFC6;background:#fff;border-radius:3px;padding:14px;text-align:left;cursor:pointer;font:400 14.5px/1.45 var(--sans);min-height:72px}
.c6:hover:not([disabled]){border-color:var(--accent)}
.c6.done{border-color:var(--good);background:var(--good-soft)}
.c6 .o{display:inline-block;min-width:22px;font-weight:700;color:var(--good)}
.steps-done{list-style:none;padding:0;margin:12px 0 0;font:400 14px var(--sans)}
/* final quiz */
.qprog{height:3px;background:#E3E3E3;margin:4px 0 18px}
.qprog span{display:block;height:100%;background:var(--accent);width:0}
.results{text-align:center;padding:40px 28px;border:1px solid #DDD;border-radius:3px;background:#fff}
.results .big{font:300 64px/1 var(--sans);color:var(--accent);margin:0 0 12px}
.results h3{font:700 23px var(--sans);margin:0 0 10px}
.results .commit{display:inline-flex;gap:10px;align-items:center;background:var(--peach);border-radius:3px;padding:12px 16px;font:500 14.5px var(--sans);margin:16px 0 10px;cursor:pointer;text-align:left}
.results .commit input{width:18px;height:18px;accent-color:var(--accent)}
.results small{display:block;font:400 12.5px var(--sans);color:var(--muted)}
.results ul{list-style:none;padding:0;margin:10px 0 0;font:400 14.5px var(--sans)}
textarea{width:100%;min-height:110px;border:1px solid #D4D4D4;border-radius:3px;padding:12px 14px;font:300 15px/1.6 var(--serif);resize:vertical;background:#fff}
.sugs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.sugs button{border:1.5px solid var(--accent);color:var(--accent);background:#fff;border-radius:999px;padding:5px 12px;font:500 12.5px var(--sans);cursor:pointer}
.sugs button:hover{background:var(--peach)}
/* job aid + weekly */
.jobaid{border:2px solid #222;border-radius:6px;padding:26px 28px;background:#fff}
@media (max-width:560px){.jobaid{padding:20px 16px}}
.jobaid header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.jobaid header span{background:var(--accent);color:#fff;font:700 11.5px var(--sans);letter-spacing:.1em;padding:5px 10px;border-radius:2px}
.jobaid header b{font:700 19px var(--sans)}
.ja-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.ja-grid section{background:#F3F3F3;border-radius:2px;padding:16px 18px}
.ja-grid h4{margin:0 0 6px;font:700 12.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ja-grid ul{list-style:none;margin:0;padding:0;font:400 14px/1.9 var(--sans)}
.ja-grid li::before{content:"• ";color:#666}
.mine{margin-top:14px;border-top:1px dashed #C8C8C8;padding-top:12px;font:400 14px var(--sans)}
.mine b{color:var(--accent)}
.attach{display:block;text-align:center;border:1.5px solid var(--accent);color:var(--accent);background:#fff;padding:13px;font:700 12.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;width:100%;margin:28px 0 0}
.attach:hover{background:var(--peach)}
.weekly .wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 24px}
.weekly label{display:flex;gap:10px;align-items:flex-start;font:400 14px/1.5 var(--sans);padding:7px 0;cursor:pointer}
.weekly input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.weekly .warn{color:var(--accent);font:500 13px var(--sans);margin:12px 0 0}
.rate{text-align:center}
.rate h3{font:700 21px var(--sans);margin:0 0 16px}
.rate .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.rate button{width:50px;height:50px;border-radius:50%;border:1.5px solid #CCC;background:#fff;font:500 17px var(--sans);cursor:pointer}
.rate button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.rate small{display:block;font:400 12.5px var(--sans);color:var(--muted);margin-top:12px}
/* continue */
.cont{padding:40px 0 70px}
.cont button{display:block;width:100%;border:0;background:var(--accent);color:#fff;padding:15px;font:700 12.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.cont button:hover{background:var(--accent-dark)}
.disclaim{font:400 12.5px/1.6 var(--sans);color:var(--muted);border-top:1px solid var(--line);padding-top:16px;margin-top:6px}

@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%}
  .no-print{display:none!important}
}

};

lesson(1,"why-this-isnt-a-rules-list","Why This Isn’t a Rules List",null,
 "You’ll make dozens of small safety decisions in your first week. This course gives you practice making them now, when mistakes cost nothing.",3,[
 {t:"p",html:"<b>Most lab safety training is a list of rules you read once and sign.</b> People skim, sign, and forget. Then, under pressure, they freeze."},
 {t:"p",html:"This course works differently. Instead of memorizing rules, you’ll practice the decisions that keep you and your coworkers safe."},
 {t:"img",src:"img/intro-beaker.jpg",text:"It’s your first week on the bench. A coworker’s beaker tips toward you. What do you do first?"},
 {t:"selfcheck"},
 {t:"path"},
 {t:"note",text:"Seven moments. Seven decisions."},
 {t:"numbered",items:[["Before you touch anything","Prepare before the work starts."],["Read the label","Know how a chemical can hurt you."],["Controls before gear","Know what protects you before PPE does."],["Dress for the lab","Wear the right gear the right way."],["Working safely","Handle chemicals, heat, glass, and storage."],["When something goes wrong","Know when to act and when to call."],["Clean exit","Leave the station and waste safe for the next person."]]},
 {t:"img",src:"img/rights-team.jpg",text:"You have the right to a safe lab, and the right to speak up."},
 {t:"p",html:"<b>California law requires every lab employer to have a written Chemical Hygiene Plan</b> and to train you before you work with hazardous chemicals. That plan also gives you rights."},
 {t:"grid",title:"Your rights",items:[["Safety training","Before your first assignment, and again before any new chemical or procedure."],["Safety information","Access to the Chemical Hygiene Plan and every SDS, on every shift."],["Speak up safely","Report hazards and near misses without fear of retaliation."],["Medical care","A free medical consultation, with no loss of pay, after a spill, leak, or symptoms."]]},
 {t:"match",band:true,tag:"Matching",title:"Who do I call?",sub:"Match each situation to the right contact.",pairs:[["Someone is seriously hurt or there’s a fire","911"],["You’re unsure an SOP covers a new step","Your supervisor"],["A spill of an unknown chemical","EH&S (Environmental Health & Safety)"],["A question about the Chemical Hygiene Plan","Chemical Hygiene Officer"]],fb:"Save these four contacts in your phone on day one."}
]);

lesson(2,"before-you-touch-anything","Before You Touch Anything",null,
 "Most lab incidents start before anyone opens a bottle. A few minutes of prep protects your coworkers, your data, and your job.",3,[
 {t:"p",html:"<b>Most lab accidents start before anyone touches a chemical:</b> a skipped step, a missing procedure, or a coworker who didn’t know about your allergy."},
 {t:"note",text:"Preparation is the first safety step."},
 {t:"numbered",items:[["Read the SOP","Read the full standard operating procedure before you start, not while you work."],["Confirm it’s approved","Use only approved chemicals and procedures. Anything not in the SOP needs your supervisor’s OK."],["Never work alone","Make sure someone else is in the lab before you begin."],["Clear your space","Personal items, food, and drinks stay out of the work area."],["Speak up about you","Tell your supervisor about allergies, asthma, contact lenses, or color blindness."]]},
 {t:"callout",band:true,title:"Know your lab’s plan",lede:"Every lab employer in California is required to have one.",items:["Find your lab’s Chemical Hygiene Plan on day one, and read and sign it along with your lab’s SOPs.","Unattended runs need supervisor approval, a sign on the door, and lights left on.","Avoid working alone. If you must, skip any task with significant chemical or physical hazards."]},
 {t:"scenario",band:true,name:"Priya",init:"P",color:"#7A6A9B",role:"Research associate, 3 years on the team",quote:"“We’re behind. Let’s triple the batch size today. Same reaction, just bigger.”",q:"What do you do?",opts:["Triple it. Priya knows the reaction well.","“Let’s get written approval from our supervisor first. Scaling up changes the hazards.”","Double it instead, as a compromise."],a:1,
  fbs:["Experience doesn’t change the chemistry. Scaling up is a significant change that needs written approval first.","","A smaller scale-up is still a change to the procedure. It needs approval too."],
  fb:"Scaling up a reaction is a significant change. It needs written approval before you start, because heat, pressure, and exposure all grow with scale."}
]);

lesson(3,"read-the-label","Read the Label",null,
 "Labels and Safety Data Sheets tell you how a chemical can hurt you and what to do if it does. Reading them takes seconds and can prevent a trip to the clinic.",4,[
 {t:"img",src:"img/label-bottles.jpg",text:"Every chemical tells you how it can hurt you. You just have to read it."},
 {t:"p",html:"<b>Chemical labels follow the Globally Harmonized System (GHS).</b> Every label has the same six parts, so once you can read one, you can read them all."},
 {t:"flash",title:"The 9 GHS pictograms",cards:[["flame","Flame","Flammable. Keep away from heat, sparks, and open flames."],["corrosion","Corrosion","Corrosive. Can burn skin and eyes, and damage metal."],["exclaim","Exclamation Mark","Irritant. May irritate skin, eyes, or airways."],["skull","Skull and Crossbones","Acutely toxic. Small amounts can kill."],["health","Health Hazard","Long-term harm, like cancer or organ damage."],["oxidizer","Flame Over Circle","Oxidizer. Feeds fires and can make them worse."],["explosive","Exploding Bomb","Explosive or self-reactive. Handle with extreme care."],["gas","Gas Cylinder","Gas under pressure. Can explode if heated."],["env","Environment","Toxic to aquatic life. Never pour down the drain."]],caption:"Click a card to flip it."},
 {t:"note",text:"“Danger” means more severe. “Warning” means less severe."},
 {t:"grid",band:true,title:"4 ways chemicals get in",items:[["Inhalation","Breathing fumes, vapors, or dust. The most common route in labs.","img/route-inhalation.jpg"],["Skin and eyes","Splashes and spills absorbed through skin or eyes.","img/route-skin-eyes.jpg"],["Ingestion","Eating, drinking, or touching your face after handling chemicals.","img/route-ingestion.jpg"],["Injection","Needle sticks, or cuts from contaminated glass.","img/route-injection.jpg"]]},
 {t:"grid",title:"Your SDS shortcut",sub:"Every SDS has the same 16 sections. These four answer most on-the-job questions. Bring the SDS with you to the clinic after any exposure.",items:[["Section 2 · Hazards","What can hurt you, and how badly."],["Section 4 · First aid","What to do right after an exposure."],["Section 7 · Handling and storage","How to use it and where it lives."],["Section 8 · Exposure controls and PPE","What gear and ventilation you need."]]},
 {t:"story",key:"labelDecoder"},
 {t:"callout",band:true,title:"Label rules",items:["Label every container in English with the full chemical name. Formulas and acronyms like “IPA” don’t count.","Include the hazard, like “Flammable” or “Corrosive.”","Never remove or deface a manufacturer’s label.","Never pour unused chemicals back into the original bottle."]}
]);

lesson(4,"controls-before-gear","Controls Before Gear",null,
 "Your lab coat and goggles are your last line of defense. Knowing what protects you before PPE helps you spot when a hood, a cabinet, or a procedure isn’t doing its job.",4,[
 {t:"img",src:"img/controls-hero.jpg",text:"The best protection is the one that works even when you forget."},
 {t:"p",html:"<b>Safety professionals rank protections by how well they work.</b> The most effective ones remove the hazard entirely. The least effective ones depend on you doing everything right, every time."},
 {t:"hierarchy"},
 {t:"note",text:"PPE is your last line of defense, not your first."},
 {t:"match",band:true,tag:"Matching",title:"Match each example to its control.",sub:"Example task: rinsing glassware with a solvent.",pairs:[["Working inside a certified fume hood","Engineering control"],["Using a less toxic solvent","Substitution"],["Following the lab’s written SOP","Administrative control"],["Wearing butyl gloves","PPE"]],fb:"The higher the control, the less it depends on you remembering."},
 {t:"h2",text:"Before you use a fume hood"},
 {t:"numbered",items:[["Check the sticker","Certification must be dated within the last year. No sticker means don’t use it.","img/hood-1.jpg"],["Check the monitor","Confirm the airflow gauge or alarm shows normal before you start.","img/hood-2.jpg"],["Set the sash","Work at the marked 18-inch height. Higher sashes drop airflow below safe levels.","img/hood-3.jpg"],["Work 6 inches in","Keep materials at least 6 inches behind the sash.","img/hood-4.jpg"],["Keep it clear, close it after","Clutter blocks airflow. Never use a hood for storage, and close the sash when you’re done.","img/hood-5.jpg"]]},
 {t:"story",key:"hoodCheck"}
]);

lesson(5,"dress-for-the-lab","Dress for the Lab",null,
 "Your gear only protects you if it’s the right gear, worn the right way. This is the last thing standing between a splash and your skin.",4,[
 {t:"p",html:"<b>Protective gear only works if you wear it correctly, every time.</b> Find the five problems with this new hire’s outfit."},
 {t:"labeled",title:"Spot the Hazard",sub:"Click each marker to see what’s wrong.",img:"img/ppe-outfit.jpg",alt:"A smiling new lab technician standing in a lab in a lab coat, with no eye protection, loose hair, a necklace, long sleeves and sandals.",markers:[
   [52.9,14.3,"No eye protection","Wear ANSI Z87.1 safety glasses, or splash goggles when liquids could splash. Prescription glasses don’t count."],
   [43.5,28.2,"Loose hair","Long hair can catch in equipment or fall into chemicals and flames. Tie it back."],
   [53.4,39.8,"Dangling necklace","Jewelry can dip into chemicals or catch on equipment. Take it off before you work."],
   [41.5,62.1,"Coat sleeves past the wrist","Loose sleeves drag through spills. Use fitted cuffs, with gloves pulled over them."],
   [53.4,88.6,"Open-toe sandals","Spills land on feet. Wear closed-toe shoes, plus full-length pants."]]},
 {t:"callout",band:true,title:"Your lab kit",lede:"Required whenever you work with or near hazardous chemicals.",items:["ANSI Z87.1 safety glasses, or splash goggles for splash risks","Lab coat, flame-resistant when working with more than 1 L of flammables or open flames","Gloves matched to the chemical you’re using","Full-length pants and closed-toe shoes"]},
 {t:"sort",band:true,title:"Lab Ready or Not?",sub:"Tap each card, then tap the right pile.",piles:["Lab Ready","Not Lab Ready"],cards:[["ANSI Z87.1 safety glasses",0,"Impact-rated with side shields. Ready."],["Prescription glasses only",1,"No side shields or impact rating. Wear goggles over them."],["Hair tied back",0,"Keeps hair away from flames and equipment."],["Shorts with a lab coat",1,"Your legs are exposed below the coat. Wear full-length pants."],["Butyl gloves for an acetone rinse",0,"Rated for acetone, so they hold up for the whole rinse."],["Disposable gloves reused all day",1,"Disposable gloves are single use. Swap them whenever they’re splashed or you take them off."]]},
 {t:"mc",band:true,tag:"Knowledge check",q:"You’re about to rinse glassware with acetone for 10 minutes. Which gloves do you use?",opts:["Thin disposable nitrile gloves","Butyl gloves rated for acetone","Latex exam gloves","No gloves, since acetone evaporates fast"],a:1,fb:"Disposable gloves only protect against small splashes, for seconds. Soaking or rinsing needs a glove rated for that chemical. Check the glove compatibility chart."},
 {t:"flash",title:"Myth or Fact?",myth:true,cards:[[null,"Prescription glasses count as eye protection.","Myth. They lack side shields and impact-rated lenses. Use Z87.1 safety glasses or over-the-glasses goggles."],[null,"I can wash my lab coat at home.","Myth. Contaminated coats go to your workplace’s lab laundry service, never home or a laundromat."],[null,"Checking my phone with gloves on is fine.","Myth. It spreads chemicals to your phone, your face, and home. Take gloves off first."]],caption:"Click a card to flip it."}
]);

lesson(6,"working-safely","Working Safely",null,
 "These habits are what experienced techs do without thinking. Building them now keeps routine tasks from turning into incidents.",5,[
 {t:"img",src:"img/working-safely.jpg",text:"Most injuries happen during routine work, not emergencies."},
 {t:"p",html:"<b>Four kinds of hazards show up in almost every lab task.</b> Click each tab to see the habits that keep you safe."},
 {t:"tabs",tabs:[["Chemicals",["Waft vapors toward you with your hand. Never sniff directly.","Use a pipette bulb or pump. Never use your mouth.","Pour acid into water, slowly, while stirring.","Carry chemicals around people, not through a crowd."]],["Heat",["Point test tubes away from people when heating.","Keep alcohol, acetone, and other flammables away from flames.","Turn burners off when they’re not in use."]],["Glass",["Check glassware for chips and cracks before you use it.","Test for heat by holding the back of your hand near the glass, not on it.","Never put hot glass in cold water."]],["Electrical",["Touch equipment with dry hands only.","Pull the plug, not the cord.","Report frayed cords right away."]]]},
 {t:"note",text:"Acid into water. Never the reverse."},
 {t:"scenario",band:true,name:"Marcus",init:"M",color:"#4E7A6B",role:"Senior lab technician",quote:"“I always add the water to the acid. It’s quicker, and I’ve never had a problem.”",q:"How do you speak up?",opts:["Say nothing. He’s been here longer than you.","“Can we pour the acid into the water instead? It’s safer that way.”","Walk away and mention it to other coworkers later."],a:1,
  fbs:["Seniority doesn’t change the chemistry. Adding water to acid can boil and spatter acid onto both of you.","","Talking about him doesn’t fix the hazard. Raise it with him directly, or with your supervisor."],
  fb:"Clear, respectful, and focused on the task, not the person."},
 {t:"sort",band:true,title:"Store It Right",sub:"Tap each chemical, then tap its storage spot.",piles:["Corrosives cabinet (acids)","Corrosives cabinet (bases)","Flammables cabinet","Oxidizers shelf"],cards:[["Hydrochloric acid",0,"Acids go in the acid corrosives cabinet, below eye level, in secondary containment."],["Sodium hydroxide",1,"Bases are corrosive too, but they’re stored apart from acids."],["Acetone",2,"Flammable solvents live in the flammables cabinet, away from heat."],["Hydrogen peroxide",3,"Oxidizers feed fires, so they stay away from flammables."],["Nitric acid",0,"An acid, and also an oxidizer. Keep it away from organics."],["Ammonium hydroxide",1,"A base. Keep it separate from acids."],["Hexane",2,"Highly flammable. Flammables cabinet."],["Potassium permanganate",3,"A strong oxidizer. Keep it away from flammables and organics."]],rule:"Corrosives go below eye level, in secondary containment."},
 {t:"callout",title:"Moving chemicals",items:["Carry bottles in a break-resistant carrier or a cart with a rail.","Never leave chemicals unattended in a hallway.","Gas cylinders go upright on a cylinder cart, with the cap on.","Don’t ride an elevator with a gas cylinder. Send it up and meet it."]}
]);

lesson(7,"when-something-goes-wrong","When Something Goes Wrong",null,
 "Emergencies are rare, but you only get one first minute. Knowing when to act and when to call protects you and the people around you.",6,[
 {t:"p",html:"<b>In an emergency, the first 60 seconds matter most.</b> If you already know where the safety equipment is, you won’t waste time looking for it."},
 {t:"note",text:"Report everything. No matter how small."},

   '<section><h4>Before lab</h4><ul><li>Read the SOP</li><li>Approved chemicals only</li><li>Never work alone</li><li>Gear on: goggles, coat, closed shoes</li></ul></section>'+
   '<section><h4>Read the label</h4><ul><li>Pictogram = type of hazard</li><li>Danger = more severe</li><li>Warning = less severe</li><li>Check the SDS for first aid</li></ul></section>'+
   '<section><h4>First 60 seconds</h4><ul><li>Splash: eyewash or shower</li><li>Flush at least 15 minutes</li><li>Spill: report acid, base, flammable</li><li>Fire: alarm, blanket, exit</li></ul></section>'+
   '<section><h4>Which bin?</h4><ul><li>Lab glass box</li><li>Sharps container</li><li>Organic solvent waste</li><li>Acid waste (separate, vented)</li></ul></section></div>'+
   (S.habit?'<p class="mine"><b>My first-day habit:</b> '+S.habit.replace(/</g,"&lt;")+'</p>':'')+'</div></div><button class="attach no-print" type="button" data-print>Download Lab Ready Card (PDF)</button>';
  $("[data-print]",d).addEventListener("click",function(){ window.print(); });
  return wrap("",d,"wide");
};
R.weekly=function(){
  var items=["Aisles at least 3 ft wide, and exits clear","Eyewash and shower reachable, with 16 in clear","Fire extinguisher in place and tagged this year","Spill kit and first aid kit stocked","Every container labeled with its full name","Incompatible chemicals stored apart","Peroxide formers dated and in date","Waste closed, labeled, under 80% full","No food or drink, and fridges labeled","Cords in good shape, with no daisy chains"];
  var d=h("div"); d.innerHTML='<div class="col" style="padding:0"><h2 class="bt" style="margin-top:20px">Your 2-minute weekly self-check</h2><p class="say" style="font-size:15.5px">Post this next to the door. Every Friday, walk your station and check each item.</p></div><div class="jobaid weekly"><header><span>WEEKLY</span><b>Lab Self-Check</b></header><div class="wk">'+items.map(function(x){return '<label><input type="checkbox"><span>'+x+'</span></label>';}).join("")+'</div><p class="warn">Found something? Fix it if it’s quick and safe. Otherwise, tell your supervisor today.</p></div>';
  return wrap("",d,"wide");
};
R.rate=function(){
  var d=h("div",{class:"rate"}); d.innerHTML='<h3>How useful was this for your job?</h3><div class="row" role="group" aria-label="Rate from 1 to 5"></div><small>1 = not useful · 5 = I’ll use this every day</small><p data-thx hidden style="font:400 14px var(--sans);margin:12px 0 0">Thanks. In a real rollout, this rating feeds the course review.</p>';
  for(var i=1;i<=5;i++){ (function(i){ var b=h("button",{type:"button","aria-pressed":String(S.rating===i),"aria-label":i+" out of 5"},String(i)); b.addEventListener("click",function(){ S.rating=i; save(); $$(".row button",d).forEach(function(x,j){ x.setAttribute("aria-pressed",String(j+1===i)); }); $("[data-thx]",d).hidden=false; }); $(".row",d).appendChild(b); })(i); }
  return wrap("",d);
};

/* ================= pages ================= */
var app=$("#app");
function menuList(container, drawer){
  SECTIONS.forEach(function(sec){ container.appendChild(h("div",{class:"menu-sec"},sec[0]));
    sec[1].forEach(function(n){ var l=L[n]; var b=h("button",{class:"menu-row"+(S.done[n]?" done":""),type:"button"},'<svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4h14M2 9h14M2 14h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="t">'+l.menu+'</span><span class="st" aria-hidden="true">'+(S.done[n]?"✓":"")+'</span>');
      b.setAttribute("aria-label",l.menu+(S.done[n]?", completed":""));
      if(drawer && cur && cur.n===n) b.setAttribute("aria-current","page");
      b.addEventListener("click",function(){ if(drawer) closeDrawer(); go(l.id); }); container.appendChild(b); }); });
}
function cover(){
  $("#topbar").hidden=true; $("#progress").hidden=true; document.title="Lab Ready: Chemical Safety for New Lab Technicians";
  app.innerHTML="";
  var c=h("section",{class:"cover",style:"background-image:url('img/cover.jpg')"}); c.innerHTML='<div class="in"><div class="by"><span class="avatar" aria-hidden="true">TV</span>Tshwjxeeb Vaaj</div><h1>Lab Ready: Chemical Safety for New Lab Technicians</h1><div class="ctas"><button class="start" type="button">'+(Object.keys(S.done).length?"RESUME":"START")+'</button><button class="details-btn" type="button" aria-expanded="false">DETAILS <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" stroke="#fff" stroke-width="1.8" fill="none"/></svg></button></div><div class="details" hidden><b>About this course</b><ul><li>For newly hired adult lab technicians</li><li>About 30 minutes, or about 12 if you test out</li><li>10 lessons, scenario practice in each one</li><li>Listen, read, or skip straight to practice</li><li>Works on phones, with a keyboard, and with a screen reader</li></ul></div></div>';
  app.appendChild(c);
  $(".start",c).addEventListener("click",function(){ var nxt=1; for(var i=0;i<ORDER.length;i++){ if(!S.done[ORDER[i]]){ nxt=ORDER[i]; break; } } go(L[nxt].id); });
  var db=$(".details-btn",c); db.addEventListener("click",function(){ var d=$(".details",c); d.hidden=!d.hidden; db.setAttribute("aria-expanded",String(!d.hidden)); });
  app.appendChild(h("div",{style:"height:70px"}));
  app.appendChild(wrap("tight",'<p>Your first week in a lab moves fast. This course walks you through the seven moments where safety decisions happen, from reading a label to knowing when to clean up a spill and when to call for help.</p><p>New to labs? Plan on about 30 minutes. Experienced? Ace the self-check and finish in about 12. Every lesson can be read aloud, has a transcript, and works with a keyboard.</p><p>Click START when you’re ready to begin.</p>'));
  var m=h("div",{style:"margin-top:30px"}); menuList(m,false); app.appendChild(wrap("",m));
  app.appendChild(foot());
}
function foot(){ return h("footer",{class:"page-foot"},'<a href="#">© 2026 Lab Ready (concept)</a><a href="../../lab-ready.html">How this course was designed</a><p class="disclaim">Lab Ready is a portfolio concept course by Tshwjxeeb Vaaj, adapted from Cal/OSHA §5191 and a university Chemical Hygiene Plan. It hasn’t been delivered to learners and is not a substitute for your own lab’s safety training, SOPs and Chemical Hygiene Plan. The supplier on the sample label is fictional.</p>'); }

var cur=null;
function page(l){
  cur=l; $("#topbar").hidden=false; $("#progress").hidden=false;
  var prev=L[l.n-1]; var cr=$("#crumb"); cr.textContent=prev?(prev.n+" – "+prev.menu):"Lab Ready: Chemical Safety"; cr.onclick=function(){ prev?go(prev.id):go(""); };
  cr.setAttribute("aria-label",prev?"Back to lesson "+prev.n+": "+prev.menu:"Back to course home");
  document.title=l.title+" · Lab Ready";
  app.innerHTML="";
  var hd=h("header",{class:"lh"}); hd.innerHTML='<div class="col"><p class="count">'+l.n+' of 10</p><h1>'+l.title+'</h1><div class="by"><span class="avatar" aria-hidden="true">TV</span>Tshwjxeeb Vaaj</div><div class="rule"></div></div>'; app.appendChild(hd);
  if(l.why){ var t=h("div"); t.innerHTML='<div class="why"><small>Why this matters on the job</small><p class="say">'+l.why+'</p></div><div class="tools"><button class="chip" type="button" data-listen aria-pressed="false"><span class="tri">▶</span> <span>Listen · '+l.mins+' min</span></button><button class="chip" type="button" data-trans aria-expanded="false">Read transcript</button><button class="chip" type="button" data-skip>Skip to practice</button></div><div class="transcript" hidden tabindex="0" aria-label="Lesson transcript"></div>'; app.appendChild(wrap("tight",t)); }
  l.blocks.forEach(function(b){ var n=R[b.t](b); app.appendChild(n); });
  // continue
  var last=l.n===10;
  var c=h("section",{class:"cont"}); c.innerHTML='<div class="col"><button type="button">'+(last?"Finish course":"Continue")+'</button></div>'; app.appendChild(c);
  $("button",c).addEventListener("click",function(){ complete(l.n); if(last){ go(""); } else go(L[l.n+1].id); });
  app.appendChild(foot());
  // tools
  var ls=$("[data-listen]",app); if(ls){ if(!("speechSynthesis" in window)) ls.remove(); else ls.addEventListener("click",function(){ toggleSpeech(ls,l); }); }
  var tr=$("[data-trans]",app); if(tr) tr.addEventListener("click",function(){ var p=$(".transcript",app); if(p.hidden){ p.innerHTML=transcript(l); } p.hidden=!p.hidden; tr.setAttribute("aria-expanded",String(!p.hidden)); });
  var sk=$("[data-skip]",app); if(sk) sk.addEventListener("click",function(){ var a=$(".kc,.story,.sort,.stage,.mrow",app); if(a){ var top=a.getBoundingClientRect().top+window.pageYOffset-70; window.scrollTo(0,top); } });
  drawChrome();
}
function transcript(l){ return [l.title].concat($$(".say",app).map(function(p){return p.textContent;})).map(function(t){return '<p style="margin:0 0 10px">'+t.replace(/</g,"&lt;")+'</p>';}).join(""); }
function stopSpeech(){ try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }
function toggleSpeech(btn,l){ if(btn.getAttribute("aria-pressed")==="true"){ stopSpeech(); btn.setAttribute("aria-pressed","false"); $("span:last-child",btn).textContent="Listen · "+l.mins+" min"; return; }
  var u=new SpeechSynthesisUtterance([l.title].concat($$(".say",app).map(function(p){return p.textContent;})).join(". ")); u.onend=function(){ btn.setAttribute("aria-pressed","false"); $("span:last-child",btn).textContent="Listen · "+l.mins+" min"; };
  stopSpeech(); speechSynthesis.speak(u); btn.setAttribute("aria-pressed","true"); $("span:last-child",btn).textContent="Stop"; }

function complete(n){ if(!S.done[n]){ S.done[n]=1; save(); drawChrome(); } }
function drawChrome(){ var n=Object.keys(S.done).length; $("#progBar").style.width=(n*10)+"%"; $("#pct").textContent=n*10+"% complete"; $("#dProg").textContent=n+" of 10 lessons complete"; var dm=$("#drawerMenu"); dm.innerHTML=""; menuList(dm,true); }

/* drawer */
var drawer=$("#drawer"), mb=$("#menuBtn");
function openDrawer(){ drawChrome(); drawer.classList.add("open"); drawer.setAttribute("aria-hidden","false"); mb.setAttribute("aria-expanded","true"); var c=$("[aria-current]",drawer)||$(".menu-row",drawer); if(c) c.focus(); }
function closeDrawer(){ drawer.classList.remove("open"); drawer.setAttribute("aria-hidden","true"); mb.setAttribute("aria-expanded","false"); mb.focus(); }
mb.addEventListener("click",openDrawer); $("[data-close]",drawer).addEventListener("click",closeDrawer);
document.addEventListener("keydown",function(e){ if(e.key==="Escape" && drawer.classList.contains("open")) closeDrawer(); });

/* routing */
function render(){ stopSpeech(); var id=location.hash.replace(/^#/,""); var l=id?byId(id):null; if(l) page(l); else { cur=null; cover(); } window.scrollTo(0,0); app.focus({preventScroll:true}); }
function go(id){ if(location.hash.replace(/^#/,"")===id) render(); else location.hash=id; }
window.addEventListener("hashchange",render);
render();
})();
</script>
</body>
</html>
